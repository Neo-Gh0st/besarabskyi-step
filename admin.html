<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бронювання — Бесарабський степ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f4f8; color: #1e293b; padding: 16px; }

        .form-card { max-width: 480px; margin: 0 auto; background: #fff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 24px; }

        h1 { font-size: 1.3rem; text-align: center; margin-bottom: 6px; color: #1e293b; }
        .subtitle { text-align: center; font-size: 0.85rem; color: #64748b; margin-bottom: 20px; }

        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; color: #334155; }

        input, select, textarea {
            width: 100%; padding: 12px 14px; border: 2px solid #e2e8f0; border-radius: 10px;
            font-size: 1rem; background: #f8fafc; transition: border-color 0.2s;
            -webkit-appearance: none;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #2563eb; background: #fff; }

        textarea { resize: vertical; min-height: 70px; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .btn-submit {
            width: 100%; padding: 14px; border: none; border-radius: 12px; background: #2563eb;
            color: #fff; font-size: 1.05rem; font-weight: 700; cursor: pointer; margin-top: 8px;
            transition: background 0.2s;
        }
        .btn-submit:hover { background: #1d4ed8; }
        .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; }

        .status { text-align: center; margin-top: 14px; font-size: 0.9rem; font-weight: 600; }
        .status--ok { color: #16a34a; }
        .status--err { color: #dc2626; }

        .optgroup-label { font-size: 0.8rem; color: #64748b; font-weight: 600; }

        @media (max-width: 400px) {
            body { padding: 10px; }
            .form-card { padding: 18px; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="form-card">
        <h1>Бронювання по телефону</h1>
        <p class="subtitle">Бесарабський степ</p>

        <form id="adminForm">
            <div class="form-group">
                <label for="callerName">Ім'я клієнта</label>
                <input type="text" id="callerName" name="name" placeholder="Олександр" required>
            </div>

            <div class="form-group">
                <label for="callerPhone">Телефон клієнта</label>
                <input type="tel" id="callerPhone" name="phone" placeholder="+380XXXXXXXXX" required>
            </div>

            <div class="form-group">
                <label for="roomType">Тип номера</label>
                <select id="roomType" name="roomType" required>
                    <option value="">Оберіть тип</option>
                    <optgroup label="1 поверх — Сімейні">
                        <option value="family">Сімейний</option>
                        <option value="family-plus">Сімейний+</option>
                        <option value="family-lux">Сімейний Люкс</option>
                    </optgroup>
                    <optgroup label="2 поверх — Сімейні">
                        <option value="family-2">Сімейний 2</option>
                        <option value="family-plus-2">Сімейний+ 2</option>
                    </optgroup>
                    <optgroup label="2 поверх — Люкс (2 кімнати)">
                        <option value="double-lux-1">Люкс 1</option>
                        <option value="double-lux-2">Люкс 2</option>
                    </optgroup>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="dateIn">Заїзд</label>
                    <input type="date" id="dateIn" name="dateIn" required>
                </div>
                <div class="form-group">
                    <label for="dateOut">Виїзд</label>
                    <input type="date" id="dateOut" name="dateOut" required>
                </div>
            </div>

            <div class="form-group">
                <label for="guests">Кількість гостей</label>
                <input type="number" id="guests" name="guests" min="1" max="10" value="2" required>
            </div>

            <div class="form-group">
                <label for="comment">Коментар</label>
                <textarea id="comment" name="comment" placeholder="Побажання клієнта..."></textarea>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Забронювати</button>
            <div class="status" id="status"></div>
        </form>
    </div>

    <script>
        var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxh4TjkSjlmQugwWgkr9WeXUamUARU_s9Ub7katGh8pzQ65s3elul-iJNri5PFu8Rzm/exec';

        var dateIn = document.getElementById('dateIn');
        var dateOut = document.getElementById('dateOut');
        var today = new Date().toISOString().split('T')[0];
        dateIn.min = today;
        dateOut.min = today;

        dateIn.addEventListener('change', function() {
            var d = new Date(this.value);
            d.setDate(d.getDate() + 1);
            dateOut.min = d.toISOString().split('T')[0];
            if (dateOut.value && dateOut.value < dateOut.min) dateOut.value = dateOut.min;
        });

        document.getElementById('adminForm').addEventListener('submit', function(e) {
            e.preventDefault();

            var btn = document.getElementById('submitBtn');
            var status = document.getElementById('status');
            btn.disabled = true;
            btn.textContent = 'Надсилання...';
            status.textContent = '';
            status.className = 'status';

            var formData = new FormData(this);
            var data = {};
            formData.forEach(function(v, k) { data[k] = v; });

            var iframeName = 'admin_iframe_' + Date.now();
            var iframe = document.createElement('iframe');
            iframe.name = iframeName;
            iframe.style.display = 'none';
            document.body.appendChild(iframe);

            var form = document.createElement('form');
            form.method = 'POST';
            form.action = SCRIPT_URL;
            form.target = iframeName;

            for (var key in data) {
                var input = document.createElement('input');
                input.type = 'hidden';
                input.name = key;
                input.value = data[key] || '';
                form.appendChild(input);
            }

            document.body.appendChild(form);
            form.submit();

            var timeout = setTimeout(function() {
                btn.disabled = false;
                btn.textContent = 'Забронювати';
                status.textContent = 'Заявку надіслано!';
                status.className = 'status status--ok';
                document.getElementById('adminForm').reset();
                dateIn.min = today;
                dateOut.min = today;
            }, 3000);
        });
    </script>
</body>
</html>
